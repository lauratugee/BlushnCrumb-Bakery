{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Blush n Crumb</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="auth-page">
    <div class="auth-card">
        <h1>Blush n Crumb</h1>
        <h2>Create an Account</h2>

        <p class="auth-intro">
            Join us and enjoy our freshly baked treats
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-button">Create Account</button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

        <a href="{% url 'index' %}" class="back-home">Back to Home

        </a>

    </div>




</body>
</html>
