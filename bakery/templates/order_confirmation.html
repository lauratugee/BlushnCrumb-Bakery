{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Received | Blush n Crumb</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="confirmation-card">
        <p class="confirmation-mark" aria-hidden="true">✓</p>
        <h1>Thank you for your order!</h1>
        <p>Your order <strong>#{{ order.id }}</strong> has been received. We’ll get it ready for you.</p>
        <p>Delivery method: {{ order.get_order_type_display }}</p>
        <a class="button-link" href="{% url 'products' %}">Continue browsing</a>
        <a class="text-link" href="{% url 'index' %}">Back to home</a>
    </main>
</body>
</html>
