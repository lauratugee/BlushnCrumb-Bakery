{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Blush n Crumb</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="auth-page">

    <div class="auth-card">
        <h1>Blush n Crumb</h1>
        <h2>Welcome Back!</h2>

        <p class="auth-intro">
            Sign in to continue enjoying your favourite freshly baked treats
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-button">
                Sign In
            </button>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="{% url 'register' %}" class="auth-link">Create Account</a>
        </p>

        <a href="{% url 'index' %}" class="back-home">
            Back to Home
        </a>
    </div>




</body>
</html>
